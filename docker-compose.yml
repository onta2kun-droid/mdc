# ==================================================================
# Moodle Deadline Companion — Docker Compose (development/demo)
# Pemakaian:  docker compose up --build
# Aplikasi  : http://localhost:8080
# Mailpit   : http://localhost:8025  (email pengingat "masuk" di sini)
# ==================================================================

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: sqlite
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: mdc@localhost
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - sqlite-data:/var/www/html/database
      - storage-data:/var/www/html/storage

  # Scheduler: menjalankan mdc:sync (tiap 30 menit) dan
  # mdc:send-reminders (tiap 5 menit) sesuai routes/console.php.
  scheduler:
    build: .
    entrypoint: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlite
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: mdc@localhost
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - sqlite-data:/var/www/html/database
      - storage-data:/var/www/html/storage
    depends_on:
      - app

  # SMTP palsu untuk mengetes email pengingat tanpa server email sungguhan.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

volumes:
  sqlite-data:
  storage-data:
