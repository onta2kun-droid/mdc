# ==================================================================
# Docker Compose untuk VPS milik sendiri (opsional, BL-08).
# Menambahkan Caddy sebagai reverse proxy dengan HTTPS otomatis
# (Let's Encrypt) untuk domain, tanpa konfigurasi sertifikat manual.
#
# Pemakaian di VPS:
#   1. Arahkan A record itsricho.my.id ke IP VPS.
#   2. docker compose -f docker-compose.vps.yml up -d --build
#   3. Caddy otomatis menerbitkan sertifikat HTTPS.
# ==================================================================

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://itsricho.my.id
      DB_CONNECTION: sqlite
      MAIL_MAILER: sendmail
      MAIL_FROM_ADDRESS: no-reply@itsricho.my.id
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - sqlite-data:/var/www/html/database
      - storage-data:/var/www/html/storage

  scheduler:
    build: .
    entrypoint: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: sqlite
      MAIL_MAILER: sendmail
      MAIL_FROM_ADDRESS: no-reply@itsricho.my.id
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - sqlite-data:/var/www/html/database
      - storage-data:/var/www/html/storage
    depends_on:
      - app

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  sqlite-data:
  storage-data:
  caddy-data:
  caddy-config:
